<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hushkeeping</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Co-op för 1–6: byt lakan under en sovande jättevarelse utan att väcka den.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: helskärmsscen i låg upplösning; menyer som små tryckta kort, spelets gränssnitt i hörnen. Ett enda nattutseende. */
:root {
  --night: #0a0c17;
  --panel: rgba(13, 15, 28, 0.82);
  --ink: #ece4d6;
  --muted: #9a93ad;
  --lace: #f3ece4;
  --lav: #b9a6d8;
  --lamp: #ffb468;
  --moon: #9db0ff;
  --danger: #f07b6e;
  --ok: #cfe8b8;
  --rule: rgba(185, 166, 216, 0.22);
  --f-title: 'IM Fell English SC', 'IM Fell English', Georgia, 'Times New Roman', serif;
  --f-tale: 'IM Fell English', Georgia, 'Times New Roman', serif;
  --f-ui: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 17px;
  line-height: 1.35;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}
#c {
  position: fixed; inset: 0; width: 100%; height: 100%; display: block;
  image-rendering: pixelated; image-rendering: crisp-edges;
  background: var(--night);
}
.fx { position: fixed; inset: 0; pointer-events: none; }
#vig { background: radial-gradient(ellipse at 50% 50%, transparent 52%, rgba(0, 0, 0, 0.6) 85%, rgba(0, 0, 0, 0.9) 100%); }
#danger { background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(120, 20, 30, 0.55) 100%); opacity: 0; transition: opacity 0.4s; }
#flash { background: #dfe8ff; opacity: 0; }
#slit { opacity: 0; background: linear-gradient(90deg, #000 0, #000 42%, transparent 46%, transparent 54%, #000 58%, #000 100%); transition: opacity 0.3s; }
#grain {
  inset: -50%; opacity: 0.08;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation: grain 0.9s steps(5) infinite;
}
@keyframes grain { 0% { transform: translate(0, 0) } 25% { transform: translate(-3%, 2%) } 50% { transform: translate(2%, -3%) } 75% { transform: translate(-2%, -1%) } 100% { transform: translate(0, 0) } }

/* ---------- skärmar (meny, lobby, rapport) */
.screen {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box; overflow-y: auto;
  align-items: flex-start;
}
/* centrerat när det får plats, rullbart uppifrån när det inte gör det */
.screen > * { margin-block: auto; }
.side { justify-content: flex-start; background: linear-gradient(90deg, rgba(8, 9, 18, 0.88) 0, rgba(8, 9, 18, 0.55) 40%, transparent 68%); }
.card {
  width: min(460px, 100%); box-sizing: border-box;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 4px;
  padding: 28px 28px 22px; display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
}
.side .card { background: transparent; border: 0; box-shadow: none; margin-left: clamp(0px, 5vw, 80px); }
.title {
  font-family: var(--f-title); font-weight: 400; margin: 0;
  font-size: clamp(46px, 8.5vw, 96px); line-height: 0.92; letter-spacing: 0.02em; color: var(--lace);
  text-shadow: 0 0 28px rgba(185, 166, 216, 0.35);
  text-wrap: balance;
}
.title .hush { color: var(--lav); }
.tag { font-family: var(--f-tale); font-style: italic; font-size: 21px; color: var(--muted); margin: -4px 0 6px; }
.eyebrow { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--lav); margin: 0; }
label, .lbl { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
input[type=text], input:not([type]) {
  font: 500 18px var(--f-ui); color: var(--ink); background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--rule); border-radius: 3px; padding: 9px 12px; outline: none; min-width: 0;
}
input:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.colors { display: flex; gap: 8px; flex-wrap: wrap; }
.colors button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; padding: 0; cursor: pointer; }
.colors button[aria-pressed=true] { border-color: var(--lace); box-shadow: 0 0 0 2px var(--night) inset; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
button {
  font: 700 16px var(--f-ui); letter-spacing: 0.04em; color: var(--ink);
  background: rgba(255, 255, 255, 0.06); border: 1px solid var(--rule); border-radius: 3px;
  padding: 10px 16px; cursor: pointer;
}
button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.11); }
button:disabled { opacity: 0.45; cursor: default; }
button.primary { background: var(--lamp); color: #24140a; border-color: var(--lamp); }
button.primary:hover:not(:disabled) { background: #ffc78c; }
button.ghost { background: transparent; }
button.link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-weight: 500; letter-spacing: 0; }
.join { display: flex; gap: 0; flex: 1 1 200px; min-width: 0; }
.join input { width: 6.2em; text-transform: uppercase; letter-spacing: 0.25em; font-weight: 700; text-align: center; border-radius: 3px 0 0 3px; flex: 1 1 auto; }
.join button { border-radius: 0 3px 3px 0; border-left: 0; }
details { border-top: 1px solid var(--rule); padding-top: 10px; }
summary { cursor: pointer; color: var(--lav); font-weight: 500; }
details ul { margin: 10px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; color: var(--ink); font-size: 15px; max-width: 60ch; }
.controls { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 8px 0 0; }
.small { font-size: 13px; color: var(--muted); }
.card p:empty { display: none; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.status-err { color: var(--danger); }
.desk-note { font-size: 13px; color: var(--lamp); }
@media (pointer: fine) { .desk-note { display: none; } }

/* lobby: panel till vänster medan man går runt i stugan */
#lobby { justify-content: flex-start; pointer-events: none; background: linear-gradient(90deg, rgba(8, 9, 18, 0.72) 0, rgba(8, 9, 18, 0.3) 28%, transparent 44%); }
#lobby .card { pointer-events: auto; width: min(380px, 100%); margin-left: clamp(0px, 3vw, 40px); padding: 18px 20px; gap: 9px; background: rgba(13, 15, 28, 0.74); transition: opacity 0.25s; }
#lobby.locked .card { opacity: 0.6; }
#lobby .code { font-size: 46px; }
.lhint { color: var(--lamp); }
#hud.lobby .hud-tl, #hud.lobby .hud-tc, #hud.lobby .hud-tr, #hud.lobby #plist { display: none; }
.code { font: 400 72px var(--f-title); letter-spacing: 0.18em; color: var(--lamp); line-height: 1; user-select: text; -webkit-user-select: text; }
.roster { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.roster li { display: flex; align-items: center; gap: 10px; font-size: 18px; }
.roster .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.roster .you { color: var(--muted); font-size: 14px; }
.nights { display: flex; gap: 8px; flex-wrap: wrap; }
.rowhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.seats { display: inline-flex; align-items: center; gap: 8px; }
#seatSeg button { padding: 3px 9px; font-size: 13px; }

/* rumslistan (där lobbylagret kan lista rum) */
.rooms-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.rooms { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 232px; overflow-y: auto; }
.rooms li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 3px; background: rgba(255, 255, 255, 0.03); }
.rooms .rn { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rooms .rm { font-size: 13px; color: var(--muted); grid-column: 1; }
.rooms button { grid-row: 1 / 3; grid-column: 2; padding: 7px 14px; font-size: 14px; }
.rooms li.empty { display: block; border: 0; background: none; padding: 2px 0; color: var(--muted); font-size: 14px; }
.nights button[aria-pressed=true] { border-color: var(--lamp); color: var(--lamp); }

/* nattkort */
#intro { background: rgba(5, 6, 12, 0.55); cursor: pointer; }
.night-card { text-align: center; max-width: 640px; display: flex; flex-direction: column; gap: 10px; }
.night-card h2 { font: 400 clamp(38px, 6vw, 64px) var(--f-title); margin: 0; color: var(--lace); text-wrap: balance; }
.night-card .sub { font: italic 24px var(--f-tale); color: var(--ink); margin: 0; }
.night-card .hint { font-size: 16px; color: var(--muted); margin: 6px 0 0; }

/* rapport */
#report { background: rgba(5, 6, 12, 0.7); }
.rep { width: min(1200px, 100%, calc((100vh - 150px) * 16 / 9)); display: flex; flex-direction: column; gap: 12px; }
.rep canvas { width: 100%; height: auto; max-width: 100%; aspect-ratio: 16 / 9; border-radius: 4px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6); }

/* ---------- spelets gränssnitt */
#hud { position: fixed; inset: 0; pointer-events: none; font-family: var(--f-ui); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); }
.hud-tl { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: max(18px, env(safe-area-inset-left, 0px)); }
#nightName { font: 400 18px var(--f-title); color: var(--lav); letter-spacing: 0.04em; }
#clock { font: 400 34px var(--f-title); color: var(--lace); font-variant-numeric: tabular-nums; line-height: 1; }
.hud-tc { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); }
#eyes { display: flex; gap: 6px; padding: 6px 10px; }
#eyes svg { width: 34px; height: 20px; overflow: visible; }
#eyes .lid { stroke: rgba(236, 228, 214, 0.55); stroke-width: 2; fill: none; }
#eyes .ball { fill: #1b1426; stroke: rgba(236, 228, 214, 0.7); stroke-width: 1.5; opacity: 0; transition: opacity 0.25s; }
#eyes .iris { fill: #f2ee9a; opacity: 0; transition: opacity 0.25s; filter: drop-shadow(0 0 4px #e8f07a); }
#eyes .open .ball, #eyes .open .iris { opacity: 1; }
#eyes .open .lid { opacity: 0; }
#eyes.flash { animation: eyeflash 0.6s ease-out; }
@keyframes eyeflash { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }
.hud-tr { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(18px, env(safe-area-inset-right, 0px)); width: min(340px, 42vw); }
#chores { list-style: none; margin: 0; padding: 10px 14px; background: rgba(10, 12, 22, 0.55); border-left: 2px solid var(--lav); display: flex; flex-direction: column; gap: 5px; font-size: 15px; }
#chores li { display: flex; gap: 8px; align-items: baseline; }
#chores li::before { content: ''; flex: none; width: 10px; height: 10px; border: 1.5px solid var(--muted); border-radius: 2px; transform: translateY(1px); }
#chores li.done { color: var(--muted); text-decoration: line-through; }
#chores li.done::before { background: var(--ok); border-color: var(--ok); }
#chores li.opt { color: var(--lamp); }
#chores.hidden { display: none; }
/* uppdragsgivaren: bara hen ser listan, de andra ser vem som har den */
#chores li.note { color: var(--ink); font-style: italic; }
#chores li.note::before, #chores li.who::before { display: none; }
#chores li.who { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--lamp); }
#plist .boss { color: var(--lamp); font-size: 12px; }
.hud-bl { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
#plist { display: flex; flex-direction: column; gap: 3px; }
#plist span { display: flex; gap: 6px; align-items: center; }
#plist i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; transition: box-shadow 0.08s; }
#plist em { color: var(--danger); font-style: normal; }
#plist small { color: var(--muted); font-size: 12px; }
/* röstmätare: grönt = viska, gult = prata, rött = högt */
.meter { position: relative; height: 8px; border-radius: 4px; overflow: hidden; background: rgba(255, 255, 255, 0.06); flex: 1 1 auto; min-width: 80px; }
.meter i { position: absolute; inset: 0; background: var(--zones, #555); }
.meter .zones { opacity: 0.25; }
.meter .fill { clip-path: inset(0 calc(100% - var(--lv, 0%)) 0 0); }
.meter.mini { height: 5px; width: 110px; flex: none; min-width: 0; }
.mic-row { display: flex; gap: 12px; align-items: center; }
.mic-row button { padding: 7px 12px; font-size: 14px; flex: none; }
.mic-row input[type=range] { width: 120px; flex: none; accent-color: var(--lamp); }
#hMic { display: flex; gap: 7px; align-items: center; color: var(--muted); }
#hMic svg { width: 14px; height: 14px; }
#hMic.warm { color: var(--lamp); }
#hMic.hot { color: var(--danger); }
#cross { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: rgba(236, 228, 214, 0.75); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5); }
#cross.on { width: 10px; height: 10px; margin: -5px 0 0 -5px; background: transparent; border: 2px solid var(--lamp); }
#prompt { position: absolute; left: 50%; top: calc(50% + 34px); transform: translateX(-50%); font-size: 17px; font-weight: 500; color: var(--ink); white-space: nowrap; }
#sub { position: absolute; left: 50%; top: calc(50% + 58px); transform: translateX(-50%); font-size: 14px; color: var(--muted); white-space: nowrap; }
#toasts { position: absolute; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; }
#toasts div { font-size: 17px; background: rgba(10, 12, 22, 0.72); padding: 6px 14px; border-radius: 3px; animation: toast 4.2s forwards; text-align: center; max-width: 80vw; }
#toasts div.big { font: 400 30px var(--f-title); color: var(--danger); background: none; letter-spacing: 0.06em; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-6px); } 8% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
/* en lapp man tittar på: texten i klartext */
#noteCard { position: absolute; left: 50%; top: calc(50% + 30px); transform: translateX(-50%) rotate(-1deg); width: min(320px, 70vw); box-sizing: border-box; padding: 14px 18px 16px; background: #efe6d2; color: #2a2038; font: italic 19px/1.3 var(--f-tale); text-shadow: none; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55); border-radius: 2px; }
#hud[data-ov] #noteCard { visibility: hidden; }
/* sömnprat: textremsa längst ner */
#talkSub { position: absolute; left: 50%; bottom: calc(9% + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: min(720px, 86vw); text-align: center; font: italic 22px var(--f-tale); color: var(--lav); opacity: 0; transition: opacity 0.6s; text-shadow: 0 0 12px rgba(0, 0, 0, 0.9), 0 1px 3px #000; }
#talkSub.on { opacity: 0.92; }
#hud[data-ov=rep] #talkSub { visibility: hidden; }
#capture { position: absolute; left: 50%; bottom: calc(18% + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
#capture b { font: 400 34px var(--f-title); color: var(--lace); }
#capture span { font-size: 16px; color: var(--ink); max-width: 70ch; }
#wig { width: 220px; height: 6px; background: rgba(255, 255, 255, 0.12); }
#wig i { display: block; height: 100%; width: 0; background: var(--lamp); transition: width 0.15s; }
#hud[data-ov] #prompt, #hud[data-ov] #sub, #hud[data-ov] #cross, #hud[data-ov=rep] .hud-tr, #hud[data-ov=rep] .hud-tc, #hud[data-ov=rep] #capture, #hud[data-ov=rep] #toasts { visibility: hidden; }
#lockHint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 400 28px var(--f-title); color: var(--lace); background: rgba(10, 12, 22, 0.65); padding: 14px 24px; pointer-events: none; }
#err { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: min(560px, 90vw); background: #2a0f12; border: 1px solid var(--danger); color: var(--ink); padding: 10px 16px; border-radius: 3px; font-size: 15px; z-index: 20; }
#loading { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font-size: 13px; color: var(--muted); }
.range { display: grid; grid-template-columns: 1fr 160px; gap: 10px; align-items: center; }
.range input { width: 100%; accent-color: var(--lamp); }
/* huvudmenyn: tre stora val */
.mainnav { display: flex; flex-direction: column; gap: 10px; width: min(330px, 100%); margin-top: 6px; }
.mainnav button { font: 400 27px var(--f-title); letter-spacing: 0.03em; text-align: left; padding: 11px 20px 12px; transition: transform 0.12s, background 0.12s; }
.mainnav button:hover:not(:disabled) { transform: translateX(4px); }
.mainnav button.ghost { border-color: transparent; color: var(--muted); }
.ptitle { font: 400 40px var(--f-title); color: var(--lace); margin: 0; line-height: 1; letter-spacing: 0.02em; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
button.link.back { font-size: 15px; text-decoration: none; color: var(--lav); }
button.back::before { content: '← '; }
button.link.back:hover { color: var(--lace); text-decoration: underline; }
.ver { font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.links { display: flex; gap: 18px; flex-wrap: wrap; }
/* inställningar och instruktioner: kort i mitten över en mörk bakgrund */
.panel { background: rgba(5, 6, 12, 0.74); }
.card.wide { width: min(780px, 100%); gap: 18px; }
.opt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 36px; }
.opt-col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.opt-group { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.opt-group h3, .subhead { font: 400 21px var(--f-title); color: var(--lav); margin: 0 0 2px; letter-spacing: 0.02em; }
.opt { display: grid; grid-template-columns: minmax(0, 1fr) 140px 46px; gap: 10px; align-items: center; min-height: 32px; }
.opt label, .opt .lbl { font-size: 15px; letter-spacing: 0; text-transform: none; color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.opt input[type=range] { width: 100%; accent-color: var(--lamp); margin: 0; }
.opt output { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.opt .wide2 { grid-column: 2 / 4; min-width: 0; }
.opt-note { font-size: 13px; color: var(--muted); margin: 0; }
select {
  font: 500 15px var(--f-ui); color: var(--ink); background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--rule); border-radius: 3px; padding: 6px 8px; width: 100%; min-width: 0;
}
select option { background: #14162a; color: var(--ink); }
select:disabled { opacity: 0.5; }
input.switch {
  appearance: none; -webkit-appearance: none; width: 42px; height: 22px; margin: 0; border-radius: 11px; cursor: pointer;
  background: rgba(255, 255, 255, 0.1); border: 1px solid var(--rule); position: relative; transition: background 0.15s;
}
input.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform 0.15s, background 0.15s; }
input.switch:checked { background: var(--lamp); border-color: var(--lamp); }
input.switch:checked::after { transform: translateX(20px); background: #24140a; }
input.switch:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; justify-self: start; align-self: flex-start; }
.seg button { border: 0; border-radius: 0; padding: 6px 12px; font-size: 14px; background: transparent; letter-spacing: 0.02em; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed=true], .seg button[aria-pressed=true]:hover { background: var(--lamp); color: #24140a; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 11px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; font-size: 17px; line-height: 1.4; max-width: 66ch; }
.steps li::before { counter-increment: s; content: counter(s); font: 400 24px var(--f-title); color: var(--lamp); line-height: 1; }
.steps b { color: var(--lace); font-weight: 700; }
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 7px 30px; }
.keys div { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 10px; align-items: baseline; font-size: 15px; }
kbd {
  font: 700 12px var(--f-ui); color: var(--ink); background: rgba(255, 255, 255, 0.08); border: 1px solid var(--rule); border-bottom-width: 2px;
  border-radius: 3px; padding: 2px 7px; white-space: nowrap; justify-self: start;
}
#fps { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); font: 500 12px var(--f-ui); color: var(--muted); pointer-events: none; font-variant-numeric: tabular-nums; }
#pause .card { width: min(380px, 100%); }
@media (prefers-reduced-motion: reduce) { #grain { animation: none; } #toasts div { animation-duration: 6s; } }
@media (max-width: 640px) { .side { background: rgba(8, 9, 18, 0.78); justify-content: center; } .side .card { margin-left: 0; } .hud-tr { width: 50vw; } #chores { font-size: 13px; } .opt-grid { grid-template-columns: minmax(0, 1fr); } .opt { grid-template-columns: minmax(0, 1fr) 112px 42px; } .opt label, .opt .lbl { font-size: 14px; } .keys div { grid-template-columns: 110px minmax(0, 1fr); } }
</style>

<body>
<canvas id="c" tabindex="-1"></canvas>
<div class="fx" id="vig"></div>
<div class="fx" id="danger"></div>
<div class="fx" id="slit"></div>
<div class="fx" id="flash"></div>
<div class="fx" id="grain"></div>

<div id="hud" hidden>
  <div class="hud-tl"><div id="nightName"></div><div id="clock">00:00</div></div>
  <div class="hud-tc"><div id="eyes"></div></div>
  <div class="hud-tr"><ul id="chores"></ul></div>
  <div class="hud-bl"><div id="hMic" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 8a5 5 0 0 0 10 0M8 13v2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><div class="meter mini" id="hMeter"><i class="zones"></i><i class="fill"></i></div></div><div id="plist"></div></div>
  <div id="cross"></div>
  <div id="prompt"></div>
  <div id="sub"></div>
  <div id="toasts"></div>
  <div id="talkSub" aria-live="polite"></div>
  <div id="noteCard" hidden></div>
  <div id="capture" hidden><b id="capT"></b><span id="capH"></span><div id="wig"><i></i></div></div>
  <div id="lockHint" hidden></div>
</div>

<section id="menu" class="screen side">
  <div class="card">
    <h1 class="title"><span class="hush">Hush</span>keeping</h1>
    <p class="tag" id="tagline"></p>
    <nav class="mainnav" id="mainNav">
      <button id="bPlay" class="primary"></button>
      <button id="bOptions"></button>
      <button id="bHowto"></button>
    </nav>
    <p class="desk-note" id="deskNote">Spelet kräver dator med mus och tangentbord.</p>
    <div class="foot"><button id="bLang" class="link"></button><span class="ver" id="ver"></span></div>
  </div>
</section>

<section id="playMenu" class="screen side" hidden>
  <div class="card">
    <div class="panel-head"><button class="back link" id="bBackPlay"></button></div>
    <h2 class="ptitle" id="lPlay"></h2>
    <div class="field"><label for="name" id="lName"></label><input id="name" type="text" maxlength="16" autocomplete="off"></div>
    <div class="field"><span class="lbl" id="lColor"></span><div class="colors" id="colors"></div></div>
    <div class="field" id="micBox"><span class="lbl" id="lMic"></span><div class="mic-row"><button id="bMic" class="ghost" disabled></button><div class="meter" id="mMeter"><i class="zones"></i><i class="fill"></i></div></div><span class="small" id="micNote"></span></div>
    <div class="actions">
      <button id="bHost" class="primary" disabled></button>
      <div class="join"><input id="code" type="text" maxlength="4" autocomplete="off" aria-label="Rumskod"><button id="bJoin" disabled></button></div>
    </div>
    <div class="field" id="roomsBox" hidden><div class="rooms-head"><span class="lbl" id="lRooms"></span><button class="link" id="bRooms"></button></div><ul class="rooms" id="rooms"></ul></div>
    <div class="actions"><button id="bSolo" class="ghost" disabled></button></div>
    <p class="small" id="status"></p>
  </div>
</section>

<section id="options" class="screen panel" hidden>
  <div class="card wide">
    <div class="panel-head"><h2 class="ptitle" id="oTitle"></h2><button class="back link" id="bBackOpt"></button></div>
    <div class="opt-grid">
      <div class="opt-col">
        <div class="opt-group">
          <h3 id="oControls"></h3>
          <div class="opt"><label for="sens" id="lSens"></label><input id="sens" type="range" min="0.2" max="3" step="0.05"><output id="sensV" for="sens"></output></div>
          <div class="opt"><label for="inv" id="lInv"></label><input id="inv" type="checkbox" class="switch"><span></span></div>
          <div class="opt"><label for="fov" id="lFov"></label><input id="fov" type="range" min="60" max="100" step="1"><output id="fovV" for="fov"></output></div>
        </div>
        <div class="opt-group">
          <h3 id="oGfx"></h3>
          <div class="opt"><span class="lbl" id="lGfx"></span><div class="seg wide2" id="gfx"><button data-v="low"></button><button data-v="normal"></button><button data-v="high"></button></div></div>
          <div class="opt"><label for="bright" id="lBright"></label><input id="bright" type="range" min="0.6" max="1.6" step="0.05"><output id="brightV" for="bright"></output></div>
          <div class="opt"><label for="shake" id="lShake"></label><input id="shake" type="checkbox" class="switch"><span></span></div>
          <div class="opt"><label for="fpsOn" id="lFps"></label><input id="fpsOn" type="checkbox" class="switch"><span></span></div>
        </div>
      </div>
      <div class="opt-col">
        <div class="opt-group">
          <h3 id="oSound"></h3>
          <div class="opt"><label for="vol" id="lVol"></label><input id="vol" type="range" min="0" max="1" step="0.05"><output id="volV" for="vol"></output></div>
          <div class="opt-group" id="ogMic">
            <div class="opt"><label for="micOn" id="lMicOn"></label><input id="micOn" type="checkbox" class="switch"><span></span></div>
            <div class="opt"><label for="micDev" id="lMicDev"></label><select id="micDev" class="wide2"></select></div>
            <div class="opt"><label for="micSens" id="lMicSens"></label><input id="micSens" type="range" min="-1" max="1" step="0.05"><output id="micSensV" for="micSens"></output></div>
            <div class="meter" id="oMeter"><i class="zones"></i><i class="fill"></i></div>
            <p class="opt-note" id="oMicNote"></p>
          </div>
        </div>
        <div class="opt-group">
          <h3 id="oLang"></h3>
          <div class="seg" id="langSeg"><button data-v="sv">Svenska</button><button data-v="en">English</button></div>
        </div>
      </div>
    </div>
    <div class="actions"><button id="bReset" class="ghost"></button></div>
  </div>
</section>

<section id="howto" class="screen panel" hidden>
  <div class="card wide">
    <div class="panel-head"><h2 class="ptitle" id="hTitle"></h2><button class="back link" id="bBackHow"></button></div>
    <ol class="steps" id="howSteps"></ol>
    <h3 class="subhead" id="hKeys"></h3>
    <div class="keys" id="howKeys"></div>
  </div>
</section>

<section id="lobby" class="screen" hidden>
  <div class="card">
    <p class="eyebrow" id="lLobby"></p>
    <p class="small lhint" id="lHint"></p>
    <div id="codeBox"><div class="small" id="lCode"></div><div class="code" id="roomCode"></div></div>
    <p class="small" id="lShare"></p>
    <div class="field"><div class="rowhead"><span class="small" id="lPlayers"></span><span class="seats" id="seatBox"><span class="small" id="lSeats"></span><span class="seg" id="seatSeg"></span></span></div><ul class="roster" id="roster"></ul></div>
    <div class="field" id="lMicBox"><span class="small" id="lMicL"></span><div class="mic-row"><div class="meter" id="lMeter"><i class="zones"></i><i class="fill"></i></div><input id="micSensL" type="range" min="-1" max="1" step="0.05"></div><span class="small" id="lMicNote"></span></div>
    <div class="field" id="bossBox"><span class="small" id="lBoss"></span><div class="nights" id="bossSeg"></div><span class="small" id="bossNote"></span></div>
    <div class="field" id="nightBox"><span class="small" id="lNight"></span><div class="nights" id="nights"></div></div>
    <div class="actions"><button id="bStart" class="primary"></button><button id="bLeave" class="ghost"></button></div>
    <p class="small" id="lWait"></p>
    <p class="small lhint" id="lStartKey"></p>
    <p class="small" id="lEmotes"></p>
    <div class="links"><button id="bLOptions" class="link"></button><button id="bLHowto" class="link"></button></div>
  </div>
</section>

<section id="intro" class="screen" hidden>
  <div class="night-card"><p class="eyebrow" id="iEye"></p><h2 id="iTitle"></h2><p class="sub" id="iSub"></p><p class="hint" id="iHint"></p><p class="small" id="iClick"></p></div>
</section>

<section id="report" class="screen" hidden>
  <div class="rep">
    <canvas id="repC" width="1200" height="675"></canvas>
    <div class="actions"><button id="bNext" class="primary"></button><button id="bRetry"></button><button id="bCabin"></button><button id="bSave" class="ghost"></button><button id="bMenu" class="ghost"></button></div>
    <p class="small" id="repNote"></p>
  </div>
</section>

<section id="pause" class="screen" hidden>
  <div class="card">
    <h2 class="ptitle" id="pTitle"></h2>
    <nav class="mainnav">
      <button id="bResume" class="primary"></button>
      <button id="bPOptions"></button>
      <button id="bPHowto"></button>
      <button id="bQuit" class="ghost"></button>
    </nav>
  </div>
</section>

<div id="err" hidden></div>
<div id="fps" hidden></div>
<div id="loading">Laddar…</div>
